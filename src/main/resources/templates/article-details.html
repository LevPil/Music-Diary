<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <title>Детали статьи</title>
</head>
<body>
<header>
  <nav>
    <a href="/">Главная</a>
    <a href="/articles">Статьи</a>
  </nav>
</header>

<main>
  <article>
    <h2 th:text="${articleDetails.title}"></h2>
    <p><strong>Автор:</strong> <span th:text="${articleDetails.authorUsername}"></span></p>
    <div th:utext="${articleDetails.content}"></div>
  </article>
  <div sec:authorize="hasRole('ADMIN')">
    <form th:action="@{/articles/article-delete/{id}(id=${articleDetails.id})}"
          th:method="get"
          onsubmit="return confirm('Вы уверены, что хотите удалить эту статью?');">
      <button type="submit" class="secondary">Удалить статью</button>
    </form>
  </div>
  <a href="/articles">Назад к списку</a>

</main>

<footer>
  <p>&copy; 2025 Music Diary</p>
</footer>
</body>
</html>
